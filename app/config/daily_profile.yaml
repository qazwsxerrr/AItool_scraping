version: stage-d-v1
snapshot_key: latest

# Default editorial pool size.  There is intentionally no minimum: an empty or
# fully gated day produces an empty snapshot rather than padded content.
total_max: 30

paper:
  hard_gate: true

# Stage D receives repeat history as context only.  It neither applies a
# daily-repeat hard rejection nor any topic/source/content quota.  The model
# may select fewer than total_max entries.
recent_history_days: 3
