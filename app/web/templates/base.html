<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI 热点内容台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div>
        <a class="brand" href="/">AI 热点内容台</a>
        <p class="subtitle">抓取、筛选与核实后的 AI 情报流</p>
      </div>
      <form class="top-search" action="/search" method="get">
        <label class="sr-only" for="top-search-input">搜索情报</label>
        <input id="top-search-input" name="q" type="search" placeholder="搜索工具、模型、Agent..." value="{{ request.query_params.get('q', '') }}">
      </form>
    </header>
    <div class="shell">
      <nav class="sidebar" aria-label="主导航">
        <a class="nav-item {{ 'active' if active_nav == 'home' else '' }}" href="/">今日精选</a>
        <a class="nav-item {{ 'active' if active_nav == 'all' else '' }}" href="/all">全部动态</a>
        <a class="nav-item {{ 'active' if active_nav == 'github' else '' }}" href="/github">GitHub 项目热点</a>
        <a class="nav-item {{ 'active' if active_nav == 'search' else '' }}" href="/search">热点搜索</a>
        <span class="nav-section">数据视图</span>
        <a class="nav-item {{ 'active' if active_nav == 'pending' else '' }}" href="/all?status=needs_review">待复核</a>
        <a class="nav-item {{ 'active' if active_nav == 'runs' else '' }}" href="/all?status=ai_failed">处理异常</a>
      </nav>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
