<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI 热点内容台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div>
        <a class="brand" href="/">AI 热点内容台</a>
        <p class="subtitle">AI HOT 风格浏览 + evidence / claim 审计</p>
      </div>
      <form class="top-search" action="/search" method="get">
        <input name="q" type="search" placeholder="搜索工具、模型、Agent、claim..." value="{{ request.query_params.get('q', '') }}">
      </form>
    </header>
    <div class="shell">
      <nav class="sidebar" aria-label="主导航">
        <a class="nav-item {{ 'active' if active_nav == 'home' else '' }}" href="/">今日精选</a>
        <a class="nav-item {{ 'active' if active_nav == 'all' else '' }}" href="/all">全部动态</a>
        <a class="nav-item {{ 'active' if active_nav == 'github' else '' }}" href="/github">GitHub 项目热点</a>
        <a class="nav-item {{ 'active' if active_nav == 'search' else '' }}" href="/search">热点搜索</a>
        <span class="nav-section">待实现</span>
        <a class="nav-item muted" href="/daily">AI 日报</a>
        <a class="nav-item muted" href="/candidates">候选池</a>
        <a class="nav-item muted" href="/claims">Claim 核实</a>
        <a class="nav-item muted" href="/evidence">证据审计</a>
        <a class="nav-item muted" href="/runs">运行记录</a>
      </nav>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
