[project]
name = "ai-tool-intel"
version = "0.1.0"
description = "AI tool intelligence RSS/Atom ingestion MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx[socks]>=0.27,<1.0",
  "feedparser>=6.0,<7.0",
  "pydantic>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "typer>=0.12,<1.0",
  "PyYAML>=6.0,<7.0",
  "python-dateutil>=2.9,<3.0",
  "fastapi>=0.111,<1.0",
  "jinja2>=3.1,<4.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
